<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date mit Nico 💕</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s ease-in-out;
            overflow-x: hidden;
        }

        /* Glaskarten-Design */
        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(230, 57, 70, 0.2);
            border: 2px solid #ffccd5;
            text-align: center;
            max-width: 450px;
            width: 100%;
            position: relative;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        h1 {
            color: #d62828;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        p {
            color: #4a4a4a;
            font-size: 16px;
            line-height: 1.5;
        }

        .step {
            display: none;
            height: 100%;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .step.active {
            display: flex;
        }

        /* Buttons */
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            position: relative;
            min-height: 80px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn-yes, .btn-next {
            background-color: #e63946;
            color: white;
        }

        .btn-yes:hover, .btn-next:hover {
            background-color: #d62828;
            transform: scale(1.05);
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            font-size: 17px;
            padding: 15px 25px;
            animation: pulse 1.5s infinite;
        }

        .btn-whatsapp:hover {
            background-color: #128C7E;
            transform: scale(1.05);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .btn-no {
            background-color: #ffb703;
            color: #000;
            padding: 18px 35px;
            font-size: 18px;
            position: absolute;
            transition: all 0.15s ease-out;
            z-index: 10;
        }

        .footer-nav {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        /* Formularfelder */
        input[type="datetime-local"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid #ff4d6d;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            background-color: #fff0f5;
            color: #d62828;
        }

        /* Aktivitäten Liste */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 5px;
            text-align: left;
        }

        .option-item {
            background: #fff0f5;
            border: 2px solid #ffccd5;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            font-weight: 600;
            color: #a4133c;
        }

        .option-item:hover {
            border-color: #ff4d6d;
            background-color: #ffe6ebd8;
        }

        .option-item.selected {
            background-color: #ff4d6d;
            color: white;
            border-color: #c9184a;
        }

        textarea {
            width: 100%;
            border: 2px solid #ffccd5;
            border-radius: 10px;
            padding: 8px;
            font-size: 14px;
            margin-top: 5px;
            resize: none;
            outline: none;
        }

        /* Sterne Bewertung */
        .stars {
            font-size: 35px;
            cursor: pointer;
            user-select: none;
            margin: 20px 0;
        }

        .star {
            color: #ffb703;
            transition: transform 0.1s;
            display: inline-block;
        }

        /* Zusammenfassung */
        .summary-box {
            background: #fff0f5;
            border: 2px solid #ff4d6d;
            border-radius: 15px;
            padding: 15px;
            text-align: left;
            margin-top: 15px;
        }

        .summary-box p {
            margin: 8px 0;
            color: #800f2f;
        }
    </style>
</head>
